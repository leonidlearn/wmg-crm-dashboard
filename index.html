<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMG CRM Migration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#13203A;--muted:#5A6577;--line:#D9DEE6;--blue:#1D3FAA;--red:#B8322A;--red-soft:#F7E1DE}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1522;--panel:#172033;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2A3550;--blue:#8AA6F5;--red:#F08A80;--red-soft:#3A2023}
}
*{box-sizing:border-box}
html.booting body{visibility:hidden}html,body{height:100%;margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(420px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
.kicker{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
p{color:var(--muted);margin:0 0 18px;font-family:Newsreader,Georgia,serif;font-size:17px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:12px 46px 12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.eye{position:absolute;top:0;right:0;bottom:0;width:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;border-radius:10px}
.eye:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.eye svg{display:block}
.eye .off{display:none}
.eye.on .open{display:none}
.eye.on .off{display:block}
button.submit{margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:12px 14px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--red-soft);color:var(--red);font-size:14px;font-weight:600;text-align:center}
</style>
<script>try{if(localStorage.getItem("wmg-crm-password"))document.documentElement.classList.add("booting")}catch(e){}</script></head>
<body>
<form class="card" id="g" autocomplete="off">
  <div class="kicker">WMG CRM Migration</div>
  <h1>Project dashboard</h1>
  <p>Enter the shared password to open the dashboard.</p>
  <label for="p">Password</label>
  <div class="field">
    <input id="p" name="password" type="password" required autofocus autocomplete="new-password">
    <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
      <svg class="open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a18.2 18.2 0 0 1-3.2 3.8"/><path d="M6.1 6.1C3.8 7.8 2 12 2 12s3.5 6 10 6c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
  </div>
  <button class="submit" type="submit">Open dashboard</button>
  <div class="err" id="e">Wrong password. Try again.</div>
</form>

const KEY="wmg-crm-password";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unlockWith(password,salt,iv,data){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(salt),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=b64(data);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},key,buf);
  return new TextDecoder().decode(plain);
}
function unlock(password){return unlockWith(password,SALT,IV,DATA)}
function arm(html){
  const boot='<script>(function(){if(window.__wmgLive)return;window.__wmgLive=true;var KEY="wmg-crm-password";var sig='+JSON.stringify(null)+';function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}async function unlockWith(password,salt,iv,data){var enc=new TextEncoder();var base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(salt),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);var buf=b64(data);var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},key,buf);return new TextDecoder().decode(plain)}function swap(next){var x=window.scrollX,y=window.scrollY;var doc=new DOMParser().parseFromString(next,"text/html");document.title=doc.title;document.head.querySelectorAll("style,link").forEach(function(n){n.remove()});doc.head.querySelectorAll("style,link").forEach(function(n){document.head.appendChild(document.adoptNode(n))});var body=document.adoptNode(doc.body);document.body.replaceWith(body);body.querySelectorAll("script").forEach(function(old){var s=document.createElement("script");for(var i=0;i<old.attributes.length;i++){var a=old.attributes[i];s.setAttribute(a.name,a.value)}s.textContent=old.textContent;old.replaceWith(s)});window.scrollTo(x,y)}async function tick(){try{var url=location.href.split("#")[0].split("?")[0];var res=await fetch(url+"?live="+Date.now(),{cache:"no-store"});var text=await res.text();var m=text.match(/const SALT=\"([^\"]+)\", IV=\"([^\"]+)\", DATA=\"([^\"]+)\"/);if(!m)return;var next=m[1]+"|"+m[2];if(next===sig)return;var password=localStorage.getItem(KEY);if(!password)return;var html=await unlockWith(password,m[1],m[2],m[3]);sig=next;swap(html)}catch(e){}}sig='+JSON.stringify("PLACE_SIG")+';setInterval(tick,10000)})();<\/script>';
  const live=boot.replace("PLACE_SIG", SALT+"|"+IV);
  const i=html.lastIndexOf("</body>");
  return i<0?html+live:html.slice(0,i)+live+html.slice(i);
}
function show(html){document.open();document.write(arm(html));document.close()}
const form=document.getElementById("g"), err=document.getElementById("e"), input=document.getElementById("p"), eye=document.getElementById("eye");
eye.addEventListener("click",()=>{
  const showPw=input.type==="password";
  input.type=showPw?"text":"password";
  eye.classList.toggle("on", showPw);
  eye.setAttribute("aria-pressed", showPw?"true":"false");
  eye.setAttribute("aria-label", showPw?"Hide password":"Show password");
  input.focus();
});
form.addEventListener("submit", async ev=>{
  ev.preventDefault();
  err.style.display="none";
  try{
    const html=await unlock(input.value);
    localStorage.setItem(KEY, input.value);
    show(html);
  }catch(e){
    err.style.display="block";
    input.select();
  }
});
(async()=>{
  const saved=localStorage.getItem(KEY);
  if(!saved){document.documentElement.classList.remove("booting");return}
  try{show(await unlock(saved))}
  catch(e){localStorage.removeItem(KEY);document.documentElement.classList.remove("booting")}
})();
