<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMG CRM Migration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#13203A;--muted:#5A6577;--line:#D9DEE6;--blue:#1D3FAA;--red:#B8322A;--red-soft:#F7E1DE}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1522;--panel:#172033;--ink:#E8ECF3;--muted:#9AA5B8;--line:#2A3550;--blue:#8AA6F5;--red:#F08A80;--red-soft:#3A2023}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
.kicker{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
p{color:var(--muted);margin:0 0 18px;font-family:Newsreader,Georgia,serif;font-size:17px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:12px 14px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--red-soft);color:var(--red);font-size:14px;font-weight:600}
</style>
</head>
<body>
<form class="card" id="g" autocomplete="off">
  <div class="kicker">WMG CRM Migration</div>
  <h1>Project dashboard</h1>
  <p>Enter the shared password to open the dashboard.</p>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" required autofocus>
  <button type="submit">Open dashboard</button>
  <div class="err" id="e">Wrong password. Try again.</div>
</form>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unlock(password){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=b64(DATA);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,buf);
  return new TextDecoder().decode(plain);
}
const form=document.getElementById("g"), err=document.getElementById("e"), input=document.getElementById("p");
form.addEventListener("submit", async ev=>{
  ev.preventDefault();
  err.style.display="none";
  try{
    const html=await unlock(input.value);
    sessionStorage.setItem("wmg-dash", html);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.style.display="block";
    input.select();
  }
});
(async()=>{
  const cached=sessionStorage.getItem("wmg-dash");
  if(cached){ document.open(); document.write(cached); document.close(); }
})();
</script>
